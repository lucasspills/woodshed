            h('span', { class: 'trophy-ic' }, icon(on ? 'trophy' : 'lock', 22)),
            h('span', { class: 'trophy-body' },
              h('span', { class: 'trophy-name', text: hidden ? 'Secret' : a.name }),
              h('span', { class: 'trophy-desc', text: hidden ? 'Keep playing to find this one.' : a.desc }),
              on ? h('span', { class: 'trophy-when', text: `Unlocked ${WS.fmtDay(got[a.id])}${a.xp ? ` · +${a.xp} XP` : ''}` })
                : !hidden && p.goal > 1 ? h('span', { class: 'trophy-prog' }, progBar((p.cur / p.goal) * 100, 'pbar-sm'), h('span', { class: 'small muted', text: ` ${WS.fmtInt(p.cur)} / ${WS.fmtInt(p.goal)}` })) : null));
        }))));
    }
  };

  /* =========================================================================================
     RECORDINGS on the Play screen
     ========================================================================================= */
  const TAGS = [['free', 'Free play'], ['score', 'Score piece'], ['improv', 'Improv'], ['ear', 'By ear'], ['other', 'Other']];
  UI.recorderPanel = () => {
    const wrap = h('div', { class: 'rec-wrap' });
    const recBtn = h('button', { type: 'button', class: 'rec-btn', onclick: () => {
      if (RC.recording) {
        const r = RC.stop();
        WS.toast(r ? `Saved “${r.name}”.` : 'Nothing was played, so nothing was saved.');
      } else RC.start();
      paintRec(); paintList(); UI.paintSessionPill();
    } });
    const recTime = h('span', { class: 'rec-time' });
    const paintRec = () => {
      recBtn.replaceChildren(h('span', { class: `rec-dot${RC.recording ? ' on' : ''}`, 'aria-hidden': 'true' }), RC.recording ? 'Stop and save' : 'Record');
      recBtn.classList.toggle('on', RC.recording);
      recBtn.setAttribute('aria-pressed', RC.recording ? 'true' : 'false');
      recTime.textContent = RC.recording ? mmss(RC.elapsed()) : '';
    };
    const tick = setInterval(() => { if (!document.body.contains(recBtn)) { clearInterval(tick); return; } if (RC.recording) recTime.textContent = mmss(RC.elapsed()); }, 250);

    const list = h('div', { class: 'rec-list' });
    const paintList = () => {
      const recs = [...RC.list()].reverse();
      if (!recs.length) { list.replaceChildren(h('p', { class: 'muted', text: 'No recordings yet. Press Record, play, then Stop. Recordings are MIDI: they replay through any sound, and you can download them as .mid files.' })); return; }
      list.replaceChildren(...recs.map((r) => {
        const playing = RC.playing && RC.playing.id === r.id;
        const pos = h('span', { class: 'rec-pos', text: playing ? '' : mmss(r.dur) });
        const bar = h('span', { class: 'rec-bar' }, h('i', {}));
        const name = h('input', { type: 'text', class: 'rec-name', value: r.name, 'aria-label': 'Recording name', onchange: (e) => RC.rename(r.id, e.target.value.trim() || r.name) });
        const tag = h('select', { 'aria-label': 'Tag', class: 'rec-tag', onchange: (e) => RC.setTag(r.id, e.target.value) }, TAGS.map(([v, t]) => h('option', { value: v, selected: r.tag === v, text: t })));
        const playB = h('button', { type: 'button', class: 'icon-btn rec-play', 'aria-label': playing ? 'Stop' : `Play ${r.name}`, onclick: () => {
          if (RC.playing && RC.playing.id === r.id) RC.stopPlayback(); else RC.play(r.id, () => paintList());
          paintList();
        } }, icon(playing ? 'stop' : 'play', 18, true));
        const row = h('div', { class: `rec-row${playing ? ' playing' : ''}`, dataset: { id: r.id } },
          playB,
          h('div', { class: 'rec-main' }, name,
            h('div', { class: 'rec-meta' }, bar, pos, h('span', { class: 'muted small', text: `${WS.fmtDay(r.day)} · ${r.notes} notes` }), tag)),
          h('button', { type: 'button', class: 'icon-btn', 'aria-label': `Download ${r.name} as MIDI`, title: 'Download .mid', onclick: () => RC.download(r.id) }, icon('download', 18)),
          h('button', { type: 'button', class: 'icon-btn', 'aria-label': `Delete ${r.name}`, title: 'Delete', onclick: () => {
            if (row.classList.contains('confirm-del')) { RC.remove(r.id); paintList(); } else { row.classList.add('confirm-del'); WS.toast('Press delete again to remove it.'); setTimeout(() => row.classList.remove('confirm-del'), 3000); }
          } }, icon('trash', 18)));
        row._bar = bar; row._pos = pos;
        return row;
      }));
    };
    const unsub = WS.bus.on('playback', (e) => {
      if (!e.id) return;
      const row = list.querySelector(`.rec-row[data-id="${e.id}"]`);
      if (row && row._bar) { row._bar.firstChild.style.width = `${Math.min(100, (e.pos / e.dur) * 100)}%`; row._pos.textContent = `${mmss(e.pos)} / ${mmss(e.dur)}`; }
    });
    onLeave(recBtn, () => { unsub(); if (RC.playing) RC.stopPlayback(); });
    paintRec(); paintList();
    wrap.append(
      h('div', { class: 'rec-head' }, recBtn, recTime),
      h('section', { class: 'panel' }, h('h2', { text: 'Recordings' }), list));
    wrap._recBtn = recBtn;
    return wrap;
  };
})();

/* ---- 90-main.js ---- */
/* Boot, routing, day rollover, offline support, and test hooks (only with ?debug). */
(function () {
  const setupDebug = () => {
    const A = WS.audio;
    const T = WS.theory;
    const D = (WS.debug = { forceTempo: null });
    D.setDay = (offset) => { WS.dayOffset = offset; WS.progress.applyFreezes(); WS.ui.rerender(); return WS.todayKey(); };
    D.state = () => JSON.parse(JSON.stringify(WS.S()));
    D.runner = () => WS.ui._runner;
    const notesFor = (p, correct) => {
      let notes;
      if (p.kind === 'chord') notes = p.pcs.map((pc) => 60 + pc);
      else { const r = 36 + p.root; notes = [r, r + p.guideInt]; }
      if (!correct) notes = notes.slice(0, -1); // drop a note
      return notes;
    };
    /* Play the current round automatically. miss: indexes to get wrong. offsetMs: timing offset from the beat. */
    D.autoplay = ({ miss = [], offsetMs = 0 } = {}) => {
      const r = WS.ui._runner;
      if (!r) throw new Error('No round running');
      const cal = (WS.S().settings.calibrationMs || 0);
      // Like a player, react to the audio clock as it is heard, rather than pre-scheduling on the wall clock.
      const events = [];
      r.prompts.forEach((p, i) => {
        const notes = notesFor(p, !miss.includes(i));
        events.push({ t: r.downbeats[i] + offsetMs / 1000, on: true, notes });
        events.push({ t: r.downbeats[i] + 2 * r.spb, on: false, notes });
      });
      events.sort((a, b) => a.t - b.t);
      const timer = setInterval(() => {
        if (!r.running) {
          // Round over: lift any keys still held, like taking hands off the keyboard
          events.filter((ev) => !ev.on).forEach((ev) => ev.notes.forEach((n) => WS.input.inject(n, false, performance.now())));
          clearInterval(timer);
          return;
        }
        const now = A.heardNow();
        while (events.length && now >= events[0].t - 0.002) {
          const ev = events.shift();
          const stamp = performance.now() + (ev.t - now) * 1000 + cal;
          ev.notes.forEach((n) => WS.input.inject(n, ev.on, stamp));
        }
        if (!events.length) clearInterval(timer);
      }, 2);
      return r.prompts.map((p) => p.sym);
    };
    // Ear games: answer the current question right (or wrong)
    D.earAnswer = (correct = true) => {
      const g = WS.ui._ear;
      if (!g || g.phase !== 'answer') return false;
      const q = g.qn;
      if (q.gid === 'quality') { const wrong = WS.ear.def('quality').levels.flatMap((l) => l.qs).find((x) => x !== q.q); g.answerQuality(correct ? q.q : wrong); return true; }
      const t = performance.now();
      const notes = q.gid === 'echo' ? q.play.melody : q.gid === 'bass' ? q.play.chords.map((c) => c.bass) : q.play.notes;
      notes.forEach((n, i) => { const nn = correct ? n : n + 1; WS.input.inject(nn, true, t + i); WS.input.inject(nn, false, t + i + 1); });
      return true;
    };
    // Tempo override for fast tests
    const orig = WS.levels.planRound;
    WS.levels.planRound = (id, mode) => {
      const plan = orig(id, mode);
      if (D.forceTempo) plan.tempo = D.forceTempo;
      return plan;
    };
  };

  const checkDay = (() => {
    let last = null;
    return () => {
      const k = WS.todayKey();
      if (last && k !== last) { WS.progress.applyFreezes(); WS.ui.rerender(); }
      last = k;
    };
  })();

  /* Offline support and installing: a service worker keeps the app and every sound you've loaded on this Mac.
     The page itself is always fetched fresh when you're online, so updates show up on the next open. */
  const registerWorker = () => {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol) || /[?&]nosw\b/.test(location.search)) return;
    navigator.serviceWorker.register('sw.js').then((reg) => {
      WS.sw = reg;
    }).catch((err) => console.warn('Offline support unavailable:', err));
  };

  (async function boot() {
    await WS.store.load();
    if (WS.DEBUG) setupDebug();
    WS.progress.applyFreezes();
    WS.log.restoreSession();
    WS.ach.boot();
    checkDay();

    window.addEventListener('hashchange', () => WS.ui.go(location.hash.slice(1) || 'tonight'));
    WS.$('#kbd-pill').addEventListener('click', () => { location.hash = '#keyboard'; });
    WS.$('#session-pill').addEventListener('click', () => { if (WS.recorder.recording) location.hash = '#play'; else if (WS.log.session) WS.ui.logForm(); });
    WS.bus.on('inputstatus', () => WS.ui.refreshRail());
    WS.ui.go(location.hash.slice(1) || 'tonight');

    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('700 40px Kalam'), document.fonts.load('400 16px "Atkinson Hyperlegible"')]).catch(() => {});
    }
    WS.input.autoConnect();
    registerWorker();

    setInterval(checkDay, 60000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) WS.store.flush();
      else checkDay();
    });
    window.addEventListener('pagehide', () => WS.store.flush());
    document.documentElement.classList.add('ready');
  })();
})();

</script>
