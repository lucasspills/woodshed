    aug:   { sym: '+',    name: 'augmented',         ints: [0, 4, 8],      steps: [0, 2, 4],    fam: 'maj' },
    maj7:  { sym: 'maj7', name: 'major 7',           ints: [0, 4, 7, 11],  steps: [0, 2, 4, 6], fam: 'maj' },
    dom7:  { sym: '7',    name: 'dominant 7',        ints: [0, 4, 7, 10],  steps: [0, 2, 4, 6], fam: 'maj' },
    min7:  { sym: 'm7',   name: 'minor 7',           ints: [0, 3, 7, 10],  steps: [0, 2, 4, 6], fam: 'min' },
    hdim7: { sym: 'ø7',   name: 'half-diminished 7', ints: [0, 3, 6, 10],  steps: [0, 2, 4, 6], fam: 'min' },
    dim7:  { sym: '°7',   name: 'diminished 7',      ints: [0, 3, 6, 9],   steps: [0, 2, 4, 6], fam: 'min' },
  };

  const ACC = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };

  T.parseName = (name) => {
    const L = T.LETTERS.indexOf(name[0]);
    const rest = name.slice(1);
    const acc = rest === '♯' ? 1 : rest === '♭' ? -1 : 0;
    return { L, acc, pc: (T.LETTER_PC[L] + acc + 12) % 12 };
  };

  /* Spell the note `semis` above `rootName`, `steps` letters up. Returns null for double accidentals. */
  T.spellFrom = (rootName, semis, steps) => {
    const r = T.parseName(rootName);
    const tL = (r.L + steps) % 7;
    const target = (r.pc + semis) % 12;
    let d = (target - T.LETTER_PC[tL] + 12) % 12;
    if (d > 6) d -= 12;
    if (Math.abs(d) > 1) return null;
    return T.LETTERS[tL] + ACC[d];
  };

  T.rootNameFor = (pc, q) => (T.Q[q].fam === 'maj' ? T.MAJ_FAM_ROOT : T.MIN_FAM_ROOT)[pc];

  T.chord = (pc, q, rootName) => {
    const def = T.Q[q];
    const rn = rootName || T.rootNameFor(pc, q);
    const fallback = def.fam === 'maj' ? T.FLAT : T.SHARP;
    const pcs = def.ints.map((i) => (pc + i) % 12);
    const tones = def.ints.map((i, k) => T.spellFrom(rn, i, def.steps[k]) || fallback[(pc + i) % 12]);
    return { kind: 'chord', root: pc, q, rootName: rn, pcs, tones, sym: rn + def.sym, name: `${rn} ${def.name}`, item: `${q}:${pc}` };
  };

  /* A shell voicing inside a major-key ii–V–I. Shape A: ii=R+7, V=R+3, I=R+7. Shape B: ii=R+3, V=R+7, I=R+3. */
  T.shell = (keyPc, role, shape) => {
    const keyName = T.KEY_NAME[keyPc];
    const map = { ii: { deg: 2, steps: 1, q: 'min7' }, V: { deg: 7, steps: 4, q: 'dom7' }, I: { deg: 0, steps: 0, q: 'maj7' } };
    const r = map[role];
    const rootPc = (keyPc + r.deg) % 12;
    const rootName = r.steps ? T.spellFrom(keyName, r.deg, r.steps) || T.rootNameFor(rootPc, r.q) : keyName;
    const base = T.chord(rootPc, r.q, rootName);
    const use7 = shape === 'A' ? role !== 'V' : role === 'V';
    const def = T.Q[r.q];
    const guideInt = use7 ? def.ints[3] : def.ints[1];
    return {
      kind: 'shell', role, shape, key: keyPc, keyName,
      root: rootPc, rootName, q: r.q,
      guidePc: (rootPc + guideInt) % 12, guideInt, guideName: use7 ? base.tones[3] : base.tones[1],
      use7, hint: use7 ? 'root + 7th' : 'root + 3rd',
      pcs: [rootPc, (rootPc + guideInt) % 12],
      sym: base.sym, name: base.name, item: `sh${shape}-${role}:${keyPc}`,
    };
  };

  /* Split a symbol into root letter, accidental and quality suffix, for lead-sheet style drawing. */
  T.symParts = (sym) => {
    const letter = sym[0];
    const acc = sym[1] === '♭' || sym[1] === '♯' ? sym[1] : '';
    return { letter, acc, suffix: sym.slice(1 + acc.length) };
  };

  T.noteName = (n) => `${T.FLAT[n % 12]}${Math.floor(n / 12) - 1}`;

  /* Name a pitch class as spelled inside a chord, falling back to flats. */
  T.pcIn = (pc, chord) => {
    if (chord && chord.tones) {
      const i = chord.pcs ? chord.pcs.indexOf(pc) : -1;
      if (i >= 0 && chord.tones[i]) return chord.tones[i];
    }
    return T.FLAT[pc];
  };

  T.matches = (spec, notes) => {
    if (!notes.length) return false;
    if (spec.kind === 'chord') {
      const have = new Set(notes.map((n) => n % 12));
      if (have.size !== spec.pcs.length) return false;
      return spec.pcs.every((pc) => have.has(pc));
    }
    // shell: exactly two keys, root on the bottom, guide tone within an octave above, all below middle C
    if (notes.length !== 2) return false;
    const [lo, hi] = notes;
    return lo % 12 === spec.root && hi % 12 === spec.guidePc && hi - lo >= 1 && hi - lo <= 12 && hi < 60;
  };

  const INTERVALS = ['unison', 'minor 2nd', 'major 2nd', 'minor 3rd', 'major 3rd', 'perfect 4th', 'tritone',
    'perfect 5th', 'minor 6th', 'major 6th', 'minor 7th', 'major 7th', 'octave'];

  /* Identify what's held, for the Keyboard screen. */
  T.identify = (notes) => {
    if (!notes.length) return null;
    const pcs = [...new Set(notes.map((n) => n % 12))];
    const bass = notes[0] % 12;
    const roots = [bass, ...pcs.filter((p) => p !== bass)];
    for (const root of roots) {
      for (const [q, def] of Object.entries(T.Q)) {
        if (def.ints.length !== pcs.length) continue;
        const set = def.ints.map((i) => (root + i) % 12);
        if (!set.every((p) => pcs.includes(p))) continue;
        const c = T.chord(root, q);
        let detail = c.name;
        if (bass !== root) {
          const idx = def.ints.findIndex((i) => (root + i) % 12 === bass);
          detail += `, ${['root position', 'first inversion', 'second inversion', 'third inversion'][idx]}`;
        }
        return { label: c.sym, detail, isChord: true };
      }
    }
    if (notes.length === 1) return { label: T.noteName(notes[0]), detail: notes[0] === 60 ? 'single note, middle C' : 'single note' };
    if (notes.length === 2) {
      const iv = notes[1] - notes[0];
      const name = iv <= 12 ? INTERVALS[iv] : `${INTERVALS[iv % 12] || 'octave'} plus an octave`;
      return { label: `${T.FLAT[notes[0] % 12]} and ${T.FLAT[notes[1] % 12]}`, detail: name };
    }
    return { label: pcs.map((p) => T.FLAT[p]).join(' '), detail: 'not a chord in the drills yet' };
  };
})();

/* ---- 20-store.js ---- */
/* Persistent state: IndexedDB first, localStorage fallback, export/import backups. */
(function () {
  const DB_NAME = 'woodshed';
  const STORE = 'kv';
  const KEY = 'state';
  let db = null;
  let saveTimer = null;

  const openDb = () => new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const idbGet = () => new Promise((resolve, reject) => {
    const r = db.transaction(STORE, 'readonly').objectStore(STORE).get(KEY);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
  const idbPut = (value) => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });

  const store = (WS.store = {
    state: null,
    backend: 'memory',
    persisted: false,

    defaults() {
      const today = WS.todayKey();
      return {
        v: 1,
        createdAt: today,
        settings: {
          planStart: WS.mondayOf(today), // Monday of roadmap week 1
          inputMode: 'auto',             // auto | midi | qwerty
          synth: 'auto',                 // auto | on | off  (sound for computer-keyboard notes)
          metroVol: 0.7,
          sfx: true,
          calibrationMs: 0,
          calibratedAt: null,
          octave: 0,
          planWeek: null,                // optional manual override of the roadmap week
          pianoVol: 0.8,                 // Play output level
          pianoRoom: 0.25,               // reverb amount, 0..1
          reverb: 'room',                // dry | room | hall
          pianoTouch: 'normal',          // light | normal | heavy velocity curve
          audioLatency: 'lowest',        // lowest | safe (bigger buffer if it crackles)
          soundMode: 'single',           // single | split | layer (Play only)
          sound: 'salamander',           // the sound in single mode
          splitLo: 'bass',               // left of the split point
          splitHi: 'salamander',         // right of the split point
          splitPoint: 60,                // lowest key of the right-hand side (middle C)
          layerA: 'salamander',
          layerB: 'pad',
          layerMix: 0.35,                // 0 = all A, 1 = all B
        },
        xp: 0,
        days: {},
        weeksAwarded: {},
        freezes: 0,
        freezeProgress: 0,
        levels: {},
        items: {},
        rounds: [],
        play: {},                        // day -> { minutes, notes } of free play
        seenIntro: false,
      };
    },

    async load() {
      let data = null;
      try {
        db = await openDb();
        data = await idbGet();
        this.backend = 'indexeddb';
      } catch (e) {
        try {
          data = JSON.parse(localStorage.getItem('woodshed-state') || 'null');
          this.backend = 'localstorage';
        } catch (e2) {
          this.backend = 'memory';
        }
      }
      this.state = this.migrate(data || this.defaults());
      try {
        if (navigator.storage && navigator.storage.persisted) this.persisted = await navigator.storage.persisted();
      } catch (e) { /* ignore */ }
      return this.state;
    },

    migrate(s) {
      const d = this.defaults();
      s.settings = Object.assign({}, d.settings, s.settings || {});
      for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
      if (s.rounds.length > 600) s.rounds = s.rounds.slice(-600);
      s.v = 1;
      return s;
    },

    save() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => this.flush(), 200);
    },

    async flush() {
      clearTimeout(saveTimer);
      const snap = JSON.parse(JSON.stringify(this.state));
      try {
        if (this.backend === 'indexeddb') await idbPut(snap);
        else if (this.backend === 'localstorage') localStorage.setItem('woodshed-state', JSON.stringify(snap));
      } catch (e) {
        console.error('Save failed', e);
        WS.toast('Progress didn’t save. Export a backup from Settings.');
      }
      if (!this._askedPersist && navigator.storage && navigator.storage.persist) {
        this._askedPersist = true;
        try { this.persisted = await navigator.storage.persist(); } catch (e) { /* ignore */ }
      }
    },

    exportJson() {
      return JSON.stringify({ app: 'woodshed', version: WS.VERSION, exportedAt: new Date().toISOString(), state: this.state }, null, 2);
    },

    async importJson(text) {
      let obj;
      try { obj = JSON.parse(text); } catch (e) { throw new Error('That file isn’t valid JSON.'); }
      if (!obj || obj.app !== 'woodshed' || !obj.state) throw new Error('That file isn’t a Woodshed backup.');
      this.state = this.migrate(obj.state);
      await this.flush();
    },

    async reset() {
      this.state = this.defaults();
      await this.flush();
    },
  });

  WS.S = () => store.state;
})();

/* ---- 30-audio.js ---- */
/* Audio: one AudioContext, a shared "heard time" clock, a lookahead metronome, small sound effects, a simple synth. */
(function () {
  const A = (WS.audio = { ctx: null });

  A.ensure = function () {
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      // 'lowest' asks Chrome for its smallest output buffer; 'safe' is a little larger if the sound crackles
      const lat = WS.S().settings.audioLatency === 'safe' ? 'interactive' : 0;
      try { this.ctx = new Ctx({ latencyHint: lat }); } catch (e) { this.ctx = new Ctx({ latencyHint: 'interactive' }); }
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp).connect(this.ctx.destination);
      this.metroGain = this.ctx.createGain();
      this.metroGain.connect(this.master);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.connect(this.master);
      this.synthGain = this.ctx.createGain();
      this.synthGain.gain.value = 0.32;
      this.synthGain.connect(this.master);
      this.applySettings();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  };

  A.applySettings = function () {
    const s = WS.S().settings;
    if (this.metroGain) this.metroGain.gain.value = s.metroVol;
    if (this.sfxGain) this.sfxGain.gain.value = s.sfx ? 0.4 : 0;
  };

  A.outLat = function () {
    const c = this.ctx;
    if (!c) return 0;
    return (c.outputLatency || 0) + (c.baseLatency || 0);
  };

  // Map of the audio clock to the performance clock, refreshed each frame.
  // "Heard time" is the audio-clock time of the sound reaching the speakers right now.
  A._stamp = function () {
    const c = this.ctx;
    if (c && c.getOutputTimestamp) {
      const ts = c.getOutputTimestamp();
      if (ts && ts.performanceTime > 0 && ts.contextTime > 0) return ts;
    }
    return { contextTime: c.currentTime - this.outLat(), performanceTime: performance.now() };
  };
  A.heardNow = function () {
    if (!this.ctx) return 0;
    const ts = this._stamp();
    return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  };
  A.perfToHeard = function (perfMs) {
    const ts = this._stamp();
    return ts.contextTime + (perfMs - ts.performanceTime) / 1000;
  };
  A.heardToPerf = function (t) {
    const ts = this._stamp();
    return ts.performanceTime + (t - ts.contextTime) * 1000;
  };

  /* Woodblock-style click */
  A.click = function (t, accent) {
    const c = this.ctx;
    const o = c.createOscillator();
    const g = c.createGain();
    const f = c.createBiquadFilter();
    o.type = 'triangle';
    o.frequency.setValueAtTime(accent ? 1500 : 1100, t);
    o.frequency.exponentialRampToValueAtTime(accent ? 900 : 700, t + 0.05);
    f.type = 'bandpass';
    f.frequency.value = accent ? 1400 : 1000;
    f.Q.value = 3;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(accent ? 1.0 : 0.7, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(f).connect(g).connect(this.metroGain);
    o.start(t);
    o.stop(t + 0.09);
  };

  const tone = (freq, t, dur, type, peak, dest) => {
    const c = A.ctx;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest);
    o.start(t);
    o.stop(t + dur + 0.02);
  };

  A.sfx = function (kind) {
    if (!this.ctx || !WS.S().settings.sfx) return;
    const t = this.ctx.currentTime + 0.005;
    const d = this.sfxGain;
    if (kind === 'perfect') { tone(1568, t, 0.18, 'sine', 0.25, d); tone(2093, t + 0.05, 0.22, 'sine', 0.18, d); }
    else if (kind === 'good') tone(1175, t, 0.14, 'sine', 0.2, d);
    else if (kind === 'miss') { tone(140, t, 0.22, 'sine', 0.5, d); tone(98, t + 0.03, 0.25, 'triangle', 0.3, d); }
    else if (kind === 'silver') [784, 988, 1175].forEach((f, i) => tone(f, t + i * 0.09, 0.35, 'triangle', 0.25, d));
    else if (kind === 'gold') [784, 988, 1175, 1568].forEach((f, i) => tone(f, t + i * 0.1, 0.6, 'sine', 0.3, d));
  };

  /* Play a note in the app.
     On the Play screen the rig decides (one sound, a split or a layer). Everywhere else it's the grand piano
     once it has loaded, and the simple synth until then. */
  A.playNote = function (n, vel) {
    if (!this.ensure()) return;
    if (WS.rig && WS.rig.active) { if (WS.rig.noteOn(n, vel)) return; this.noteOn(n, vel); return; }
    const P = WS.piano;
    if (P && P.available()) {
      if (P.status === 'idle') P.load();
      if (P.ready() && P.noteOn(n, vel)) return;
    }
    this.noteOn(n, vel);
  };
  A.stopNote = function (n) {
    if (WS.rig) WS.rig.noteOff(n);
    if (WS.piano) WS.piano.noteOff(n);
    this.noteOff(n);
  };
  A.pedal = function (down) {
    if (WS.rig && WS.rig.active) WS.rig.pedal(down);
    else if (WS.piano) WS.piano.pedal(down);
  };

  /* Simple voice for computer-keyboard notes (fallback while the piano loads) */
  const voices = new Map();
  A.noteOn = function (n, vel) {
    const c = this.ensure();
    if (!c) return;
    this.noteOff(n);
    const t = c.currentTime;
    const f = 440 * Math.pow(2, (n - 69) / 12);
    const o1 = c.createOscillator();
    const o2 = c.createOscillator();
    const lp = c.createBiquadFilter();
    const g = c.createGain();
    o1.type = 'triangle'; o1.frequency.value = f;
    o2.type = 'sine'; o2.frequency.value = f * 2; o2.detune.value = 3;
    lp.type = 'lowpass'; lp.frequency.value = 2600;
    const peak = 0.25 + 0.35 * (vel / 127);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(peak * 0.35, t + 0.6);
    o1.connect(lp); o2.connect(lp); lp.connect(g).connect(this.synthGain);
    o1.start(t); o2.start(t);
    voices.set(n, { o1, o2, g });
  };
  A.noteOff = function (n) {
    const v = voices.get(n);
    if (!v || !this.ctx) return;
    const t = this.ctx.currentTime;
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(Math.max(v.g.gain.value, 0.0001), t);
    v.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    v.o1.stop(t + 0.3); v.o2.stop(t + 0.3);
    voices.delete(n);
  };

  /* Lookahead metronome (Chris Wilson's "tale of two clocks" pattern: 25 ms timer, 100 ms horizon). */
  A.Metronome = class {
    start({ t0, spb, beatsPerBar = 4, pattern = 'all', countInBars = 1, endTime = Infinity }) {
      Object.assign(this, { t0, spb, bpb: beatsPerBar, pattern, countIn: countInBars, end: endTime, next: 0 });
      this.timer = setInterval(() => this.tick(), 25);
      this.tick();
    }
    tick() {
      const c = A.ctx;
      const horizon = c.currentTime + 0.1;
      for (;;) {
        const t = this.t0 + this.next * this.spb;
        if (t > horizon || t > this.end) break;
        const beat = this.next % this.bpb;
        const inCount = Math.floor(this.next / this.bpb) < this.countIn;
        let play = true;
        if (!inCount && this.pattern === '24') play = beat === 1 || beat === 3;
        if (!inCount && this.pattern === 'none') play = false;
        if (play && t >= c.currentTime - 0.005) A.click(t, beat === 0 && (inCount || this.pattern === 'all'));
        this.next++;
      }
    }
    stop() { clearInterval(this.timer); this.timer = null; }
  };
})();

/* ---- 35-sampler.js ---- */
/* Sampled instruments, and the shared path every sound in Play goes through.

   Each instrument is a set of recordings: one file per sampled note and velocity band, made by
   tools/make_sounds.py and listed in WS.ZONES (inlined by build.py). Files load on demand from sounds/<id>/,
   and the service worker keeps them on this Mac after the first time.

   Velocity: the touch curve maps key velocity to 0..1, which picks two neighbouring bands and blends them
   with an equal-power crossfade, plus a little gain inside a band.

   Latency choices (unchanged from 0.2):
   - Play has its own path straight to the speakers. It skips the shared compressor, which looks ahead a few
     milliseconds; a zero-latency soft clipper keeps loud chords from distorting instead.
   - Every sample starts at its real attack: the near-silence before the hammer is trimmed at decode time.
   - Notes start at currentTime: nothing is scheduled ahead. */
(function () {
  const A = WS.audio;
  const CURVES = { light: 0.7, normal: 1, heavy: 1.45 };

  /* ---------- The shared output: dry + reverb, volume, soft clipper ---------- */
  const O = (WS.out = { bus: null, preset: null });

  const softClip = (c) => {
    const n = 2048;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      // linear up to 0.6, then a smooth knee into 1.0
      const ax = Math.abs(x);
      const y = ax < 0.6 ? ax : 0.6 + 0.4 * Math.tanh((ax - 0.6) / 0.4);
      curve[i] = Math.sign(x) * y;
    }
    const ws = c.createWaveShaper();
    ws.curve = curve;
    ws.oversample = 'none';
    return ws;
  };

  /* Generated impulse responses. Room: a small studio, short and fairly bright. Hall: a concert hall,
     longer, darker, with a short gap before the reverb so the attack stays clear. */
  const ROOMS = {
    room: { seconds: 1.3, decay: 4.6, early: [0.009, 0.015, 0.023, 0.031], predelay: 0, dark: 0.45, wet: 0.6 },
    hall: { seconds: 3.4, decay: 1.9, early: [0.019, 0.031, 0.047, 0.063, 0.081], predelay: 0.022, dark: 0.5, wet: 0.42 },
  };
  O.ROOMS = ROOMS;
  const impulses = {};
  const impulse = (c, name) => {
    if (impulses[name]) return impulses[name];
    const p = ROOMS[name];
    const len = Math.round(c.sampleRate * p.seconds);
    const ir = c.createBuffer(2, len, c.sampleRate);
    const rnd = WS.rng(name === 'hall' ? 1977 : 42);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / c.sampleRate;
        // a few early reflections, then a darkening exponential tail
        const early = p.early.some((e) => Math.abs(t - e - ch * 0.003) < 0.0004) ? 0.5 : 0;
        const noise = rnd() * 2 - 1;
        lp += (noise - lp) * Math.max(0.04, 0.55 - p.dark * Math.min(1, t / p.seconds));
        const tt = Math.max(0, t - p.predelay);
        const tail = t < p.predelay ? 0 : lp * Math.exp(-tt * p.decay);
        d[i] = (tail + early) * (tt < 0.008 ? tt / 0.008 : 1);
      }
    }
    impulses[name] = ir;
    return ir;
  };

  O.ensure = function () {
    const c = A.ensure();
    if (!c) return null;
    if (O.bus) return c;
    O.bus = c.createGain();
    O.out = c.createGain();
    O.dry = c.createGain();
    O.wet = c.createGain();
    O.verb = c.createConvolver();
    O.clip = softClip(c);
    O.bus.connect(O.dry).connect(O.out);
    O.bus.connect(O.verb).connect(O.wet).connect(O.out);
    O.out.connect(O.clip).connect(c.destination);
    O.apply();
    return c;
  };

  O.apply = function () {
    if (!O.bus) return;
    const s = WS.S().settings;
    const t = A.ctx.currentTime;
    O.out.gain.setTargetAtTime(s.pianoVol, t, 0.02);
    // The dry signal stays at full level so the attack never softens
    O.dry.gain.setTargetAtTime(1, t, 0.02);
    const room = ROOMS[s.reverb] ? s.reverb : null;
    if (room && O.preset !== room) { O.verb.buffer = impulse(A.ctx, room); O.preset = room; }
    O.wet.gain.setTargetAtTime(room ? s.pianoRoom * ROOMS[room].wet : 0, t, 0.02);
  };

  /* ---------- Loading helpers ---------- */
  const attackOffset = (buf) => {
    const ch = buf.getChannelData(0);
    const ch2 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : ch;
    const lim = Math.min(ch.length, Math.round(buf.sampleRate * 0.08));
    let peak = 0;
    for (let i = 0; i < lim; i++) peak = Math.max(peak, Math.abs(ch[i]), Math.abs(ch2[i]));
    const thr = peak * 0.02;
    for (let i = 0; i < lim; i++) {
      if (Math.abs(ch[i]) > thr || Math.abs(ch2[i]) > thr) return Math.max(0, (i - Math.round(buf.sampleRate * 0.0015)) / buf.sampleRate);
    }
    return 0;
  };
  WS.soundUrl = (id, file) => `sounds/${id}/${file}?v=${(WS.SOUND_VERSION || {})[id] || '1'}`;

  /* ---------- A sampled instrument ---------- */
  class Sampler {
    constructor(def) {
      this.def = def;
      this.id = def.id;
      this.zones = (WS.ZONES || {})[def.id] || null;
      this.bands = this.zones ? this.zones.bands : 0;
      this.status = 'idle';     // idle | loading | ready | error
      this.loaded = 0;
      this.total = 0;
      this.layersReady = [];    // bands decoded so far
      this.pedalDown = false;
      this._bufs = {};          // band -> root midi -> { buf, off, tune }
      this.roots = {};          // band -> sorted roots
      this.voices = new Map();  // midi -> [voice]
      this.all = [];            // every live voice, oldest first
      this.bytes = 0;           // decoded size, for the memory budget
      this.out = null;
    }

    available() { return !!(this.zones && Object.keys(this.zones.files).length); }
    ready() { return this.status === 'ready'; }

    connect() {
      const c = O.ensure();
      if (!c) return null;
      if (!this.out) {
        this.out = c.createGain();
        this.out.gain.value = Math.pow(10, (this.def.trim || 0) / 20);
        this.out.connect(O.bus);
      }
      return c;
    }

    load() {
      if (this.status === 'loading' || this.status === 'ready') return this._loading;
      if (!this.available()) { this.status = 'error'; WS.bus.emit('sound', this); return Promise.resolve(); }
      const c = this.connect();
      if (!c) { this.status = 'error'; WS.bus.emit('sound', this); return Promise.resolve(); }
      this.status = 'loading';
      const files = this.zones.files;
      const bands = Object.keys(files).map(Number).sort((a, b) => a - b);
      // Middle band first, so the whole keyboard plays as soon as possible; then the rest, softest first
      const mid = bands[Math.floor((bands.length - 1) / 2)];
      const order = [mid, ...bands.filter((b) => b !== mid)];
      const jobs = [];
      for (const b of order) for (const [root, z] of Object.entries(files[b])) jobs.push({ b, root: Number(root), z });
      this.total = jobs.length;
      this.loaded = 0;
      WS.bus.emit('sound', this);
      const decoded = new Map();   // the same file can serve two bands
      const getBuf = (f) => {
        if (!decoded.has(f)) {
          decoded.set(f, fetch(WS.soundUrl(this.id, f))
            .then((r) => { if (!r.ok) throw new Error(`${r.status} for ${f}`); return r.arrayBuffer(); })
            .then((ab) => c.decodeAudioData(ab))
            .then((buf) => { this.bytes += buf.length * buf.numberOfChannels * 4; return { buf, off: attackOffset(buf) }; }));
        }
        return decoded.get(f);
      };
      this._loading = (async () => {
        try {
          for (const b of order) {
            const mine = jobs.filter((j) => j.b === b);
            for (let i = 0; i < mine.length; i += 6) {
              await Promise.all(mine.slice(i, i + 6).map(async (j) => {
                const s = await getBuf(j.z.f);
                (this._bufs[b] = this._bufs[b] || {})[j.root] = { buf: s.buf, off: s.off, tune: j.z.tune || 0 };
                this.loaded++;
              }));
              WS.bus.emit('sound', this);
            }
            this.layersReady.push(b);
            this.roots[b] = Object.keys(this._bufs[b]).map(Number).sort((x, y) => x - y);
            if (b === order[0]) { this.status = 'ready'; WS.bus.emit('sound', this); }
          }
          WS.bus.emit('sound', this);
        } catch (err) {
          console.error(`${this.def.name} failed to load`, err);
          if (!this.layersReady.length) this.status = 'error';
          this.failed = true;
          WS.bus.emit('sound', this);
        }
      })();
      return this._loading;
    }

    /* Free the decoded audio (the files stay cached on disk). */
    unload() {
      this.allOff();
      this._bufs = {};
      this.roots = {};
      this.layersReady = [];
      this.status = 'idle';
      this.loaded = 0;
      this.bytes = 0;
      this._loading = null;
    }

    /* ---------- Velocity ---------- */
    touch(vel) {
      const k = CURVES[WS.S().settings.pianoTouch] || 1;
      return Math.pow(WS.clamp(vel, 1, 127) / 127, k);
    }
    // Which bands to blend, and how much of each (equal-power crossfade)
    layerMix(x) {
      const have = this.layersReady.slice().sort((a, b) => a - b);
      if (!have.length) return [];
      if (have.length === 1 || this.bands === 1) return [[have[0], 1]];
      const pos = x * (this.bands - 1);
      const lo = Math.floor(pos);
      const hi = Math.min(this.bands - 1, lo + 1);
      const f = pos - lo;
      const pick = (i) => (have.includes(i) ? i : have.reduce((b, l) => (Math.abs(l - i) < Math.abs(b - i) ? l : b), have[0]));
      const a = pick(lo), b = pick(hi);
      if (a === b || f < 0.02) return [[a, 1]];
      return [[a, Math.cos(f * Math.PI / 2)], [b, Math.sin(f * Math.PI / 2)]];
    }

    nearestRoot(band, n) {
      const roots = this.roots[band] || [];
      let best = roots[0];
      for (const r of roots) if (Math.abs(r - n) < Math.abs(best - n)) best = r;
      return best;
    }

    /* ---------- Voices ---------- */
    fadeVoice(v, tau, t) {
      if (v.dead) return;
      v.dead = true;
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setValueAtTime(v.g.gain.value, t);
      v.g.gain.setTargetAtTime(0, t, tau);
      for (const s of v.srcs) { try { s.stop(t + tau * 8); } catch (e) { /* already stopped */ } }
    }
    drop(v) {
      this.all = this.all.filter((x) => x !== v);
      const list = this.voices.get(v.n);
      if (list) {
        const rest = list.filter((x) => x !== v);
        if (rest.length) this.voices.set(v.n, rest); else this.voices.delete(v.n);
      }
    }

    noteOn(n, vel, level = 1) {
      if (!this.ready()) return false;
      const d = this.def;
      if (d.range && (n < d.range[0] || n > d.range[1])) return false;
      const c = A.ctx;
      if (c.state === 'suspended') c.resume();
      const t = c.currentTime;
      // Re-striking a key damps the string that's still ringing
      for (const old of this.voices.get(n) || []) this.fadeVoice(old, 0.06, t);
      // Voice stealing: release the oldest notes first
      while (this.all.length >= (d.maxVoices || 72)) { const v = this.all[0]; this.fadeVoice(v, 0.03, t); this.drop(v); }

      const x = this.touch(vel);
      const g = c.createGain();
      // The bands carry most of the dynamics; this adds the rest within a band
      const minG = d.minGain == null ? 0.42 : d.minGain;
      g.gain.value = (minG + (1 - minG) * x) * level;
      g.connect(this.out);
      const srcs = [];
      for (const [band, w] of this.layerMix(x)) {
        const root = this.nearestRoot(band, n);
        const s = this._bufs[band] && this._bufs[band][root];
        if (!s) continue;
        const src = c.createBufferSource();
        src.buffer = s.buf;
        src.playbackRate.value = Math.pow(2, (n - root + s.tune / 100) / 12);
        let dest = g;
        if (w < 0.999) { const wg = c.createGain(); wg.gain.value = w; wg.connect(g); dest = wg; }
        src.connect(dest);
        src.start(t, s.off);
        srcs.push(src);
      }
      if (!srcs.length) { g.disconnect(); return false; }
      const v = { n, g, srcs, held: true, dead: false, born: t };
      srcs[0].onended = () => { this.drop(v); try { g.disconnect(); } catch (e) { /* ok */ } };
      this.all.push(v);
      this.voices.set(n, [...(this.voices.get(n) || []).filter((o) => !o.dead), v]);
      return true;
    }

    release(v, t) {
      const from = this.def.noDamperFrom;
      if (from && v.n >= from) return;             // undamped strings ring out on their own
      this.fadeVoice(v, this.def.releaseTau || 0.09, t); // a felt damper: quick but not a click
    }

    noteOff(n) {
      const list = this.voices.get(n);
      if (!list || !A.ctx) return;
      const t = A.ctx.currentTime;
      for (const v of list) {
        v.held = false;
        if (!this.pedalDown) this.release(v, t);
      }
    }

    pedal(down) {
      if (this.def.pedal === false) return;
      this.pedalDown = down;
      if (down || !A.ctx) return;
      const t = A.ctx.currentTime;
      for (const v of this.all) if (!v.held && !v.dead) this.release(v, t);
    }

    allOff() {
      if (!A.ctx) return;
      const t = A.ctx.currentTime;
      for (const v of this.all) this.fadeVoice(v, 0.05, t);
      this.pedalDown = false;
    }

    voiceCount() { return this.all.filter((v) => !v.dead).length; }
    sustainedNotes() {
      const from = this.def.noDamperFrom || 999;
      return [...new Set(this.all.filter((v) => !v.dead && !v.held && v.n < from).map((v) => v.n))];
    }
  }

  WS.Sampler = Sampler;

  /* Latency the browser reports for the audio path, in ms. */
  WS.audioLatency = function () {
    const c = A.ctx;
    if (!c) return null;
    const base = (c.baseLatency || 0) * 1000;
    const out = (c.outputLatency || 0) * 1000;
    return { base, out, total: base + out, rate: c.sampleRate };
  };
})();

/* ---- 36-pad.js ---- */
/* Synth Pad: a warm analog-style pad generated live with Web Audio, so there's nothing to download.
   Per voice: two detuned saws and a sine an octave down, through a low-pass filter that opens with
   velocity, and a slow attack and long release. A shared slow LFO drifts the detune for a chorus feel.
   Same interface as WS.Sampler, so the rig treats it like any other instrument. */
(function () {
  const A = WS.audio;
  const CURVES = { light: 0.7, normal: 1, heavy: 1.45 };

  class PadSynth {
    constructor(def) {
      this.def = def;
      this.id = def.id;
      this.status = 'idle';
      this.loaded = 0;
      this.total = 0;
      this.layersReady = [0];
      this.bands = 1;
      this.pedalDown = false;
      this.voices = new Map();
      this.all = [];
      this.bytes = 0;
      this.out = null;
    }

    available() { return true; }
    ready() { return this.status === 'ready'; }

    load() {
      const c = WS.out.ensure();
      if (!c) { this.status = 'error'; WS.bus.emit('sound', this); return Promise.resolve(); }
      if (!this.out) {
        this.out = c.createGain();
        this.out.gain.value = Math.pow(10, (this.def.trim || 0) / 20);
        // Gentle low shelf cut and high cut, so it sits under a piano instead of on top of it
        const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 70;
        const tone = c.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 5200; tone.Q.value = 0.5;
        this.out.connect(hp).connect(tone).connect(WS.out.bus);
        this.lfo = c.createOscillator();
        this.lfo.frequency.value = 0.23;
        this.lfoDepth = c.createGain();
        this.lfoDepth.gain.value = 6;            // cents
        this.lfo.connect(this.lfoDepth);
        this.lfo.start();
      }
      this.status = 'ready';
      WS.bus.emit('sound', this);
      return Promise.resolve();
    }
    unload() { this.allOff(); }

    touch(vel) {
      const k = CURVES[WS.S().settings.pianoTouch] || 1;
      return Math.pow(WS.clamp(vel, 1, 127) / 127, k);
    }

    kill(v, tau, t) {
      if (v.dead) return;
      v.dead = true;
      v.amp.gain.cancelScheduledValues(t);
      v.amp.gain.setValueAtTime(Math.max(v.amp.gain.value, 0.0001), t);
      v.amp.gain.setTargetAtTime(0, t, tau);
      for (const o of v.oscs) { try { o.stop(t + tau * 8); } catch (e) { /* ok */ } }
    }
    drop(v) {
      this.all = this.all.filter((x) => x !== v);
      const list = this.voices.get(v.n);
      if (list) {
        const rest = list.filter((x) => x !== v);
        if (rest.length) this.voices.set(v.n, rest); else this.voices.delete(v.n);
      }
    }

    noteOn(n, vel, level = 1) {
      if (!this.ready()) return false;
      const c = A.ctx;
      const t = c.currentTime;
      for (const old of this.voices.get(n) || []) this.kill(old, 0.08, t);
      while (this.all.length >= (this.def.maxVoices || 24)) { const v = this.all[0]; this.kill(v, 0.05, t); this.drop(v); }
      const x = this.touch(vel);
      const f = 440 * Math.pow(2, (n - 69) / 12);
      const mk = (type, freq, detune, gain) => {
        const o = c.createOscillator();
        o.type = type;
        o.frequency.value = freq;
        o.detune.value = detune;
        this.lfoDepth.connect(o.detune);
        const g = c.createGain();
        g.gain.value = gain;
        o.connect(g);
        return { o, g };
      };
      const parts = [mk('sawtooth', f, -7, 0.5), mk('sawtooth', f, 7, 0.5), mk('sine', f / 2, 0, 0.55)];
      const filt = c.createBiquadFilter();
      filt.type = 'lowpass';
      filt.Q.value = 0.8;
      // The filter opens with velocity and blooms a little over the attack
      const cut = Math.min(9000, 380 + 2600 * x + f * 1.5);
      filt.frequency.setValueAtTime(cut * 0.45, t);
      filt.frequency.linearRampToValueAtTime(cut, t + 0.6);
      filt.frequency.setTargetAtTime(cut * 0.8, t + 0.6, 1.5);
      const amp = c.createGain();
      const peak = (0.05 + 0.42 * x) * level;
      amp.gain.setValueAtTime(0.0001, t);
      amp.gain.linearRampToValueAtTime(peak, t + 0.16);
      amp.gain.setTargetAtTime(peak * 0.85, t + 0.16, 0.8);
      for (const p of parts) p.g.connect(filt);
      filt.connect(amp).connect(this.out);
      for (const p of parts) p.o.start(t);
      const v = { n, amp, oscs: parts.map((p) => p.o), held: true, dead: false };
      v.oscs[0].onended = () => {
        this.drop(v);
        for (const o of v.oscs) { try { this.lfoDepth.disconnect(o.detune); } catch (e) { /* ok */ } }
        try { amp.disconnect(); } catch (e) { /* ok */ }
      };
      this.all.push(v);
      this.voices.set(n, [...(this.voices.get(n) || []).filter((o) => !o.dead), v]);
      return true;
    }

    noteOff(n) {
      const list = this.voices.get(n);
      if (!list || !A.ctx) return;
      const t = A.ctx.currentTime;
      for (const v of list) {
        v.held = false;
        if (!this.pedalDown) this.kill(v, 0.45, t);
      }
    }
    pedal(down) {
      this.pedalDown = down;
      if (down || !A.ctx) return;
      const t = A.ctx.currentTime;
      for (const v of this.all) if (!v.held && !v.dead) this.kill(v, 0.45, t);
    }
    allOff() {
      if (!A.ctx) return;
      const t = A.ctx.currentTime;
      for (const v of this.all) this.kill(v, 0.05, t);
      this.pedalDown = false;
    }
    voiceCount() { return this.all.filter((v) => !v.dead).length; }
    sustainedNotes() { return [...new Set(this.all.filter((v) => !v.dead && !v.held).map((v) => v.n))]; }
  }

  WS.PadSynth = PadSynth;
})();

/* ---- 37-sounds.js ---- */
/* The instrument catalog, loading and memory, and the Play rig (one sound, a split, or a layer). */
(function () {
  const INSTRUMENTS = [
    { id: 'salamander', name: 'Salamander Grand', family: 'Pianos', blurb: 'Yamaha C5 concert grand. Warm and even: the one you know.',
      credit: 'Salamander Grand Piano V3 by Alexander Holm (CC BY 3.0)', noDamperFrom: 89 },
    { id: 'steinway', name: 'Steinway Grand', family: 'Pianos', blurb: 'Darker and rounder, with four velocity layers instead of three.',
      credit: 'Splendid Grand Piano (Steinway), sfzinstruments (public domain)', noDamperFrom: 89 },
    { id: 'kawai', name: 'Kawai Grand', family: 'Pianos', blurb: 'Clear and modern, a little brighter than the other two grands.',
      credit: 'Versilian Community Sample Library, Kawai grand (CC0)', noDamperFrom: 89, trim: 4 },
    { id: 'upright', name: 'Upright Piano', family: 'Pianos', blurb: 'Smaller and boxier. The cozy living-room piano, great for pop and songwriting.',
      credit: 'Versilian Community Sample Library, Knight upright (CC0)', noDamperFrom: 89, minGain: 0.32 },
    { id: 'honkytonk', name: 'Honky-Tonk', family: 'Pianos', blurb: 'An old, slightly out-of-tune saloon piano. Blues and ragtime.',
      credit: 'Old Piano by Francis Bacon, freepats (CC0)', noDamperFrom: 89, minGain: 0.18 },
    { id: 'rhodes', name: 'Rhodes', family: 'Electric pianos', blurb: '1977 Rhodes Mark I. Warm and bell-like; dig in and it barks. Neo-soul, R&B, jazz.',
      credit: 'jRhodes3d by Jeff Learman (CC0)', releaseTau: 0.12 },
    { id: 'wurlitzer', name: 'Wurlitzer', family: 'Electric pianos', blurb: 'Wurlitzer EP200. Reedy and gritty, the classic 60s and 70s pop and soul keys.',
      credit: 'Greg Sullivan’s E-Pianos, Wurlitzer EP200 (CC BY 3.0)', releaseTau: 0.1 },
    { id: 'bass', name: 'Bass', family: 'Bass and synth', blurb: 'Electric Jazz Bass. It sounds an octave below the keys, like a real bass. Best on the left of a split.',
      credit: 'Growly Bass by D. Smolken (CC0)', pedal: false, releaseTau: 0.06, minGain: 0.4, range: [21, 84] },
    { id: 'pad', name: 'Synth Pad', family: 'Bass and synth', blurb: 'A warm, slow pad made live in the browser, so there’s nothing to load. Lovely under held chords.',
      credit: 'Made in Woodshed', synth: true, maxVoices: 24, trim: 2 },
  ];
  const BY_ID = Object.fromEntries(INSTRUMENTS.map((d) => [d.id, d]));

  /* ---------- Engines and memory ---------- */
  // Decoded audio is big (a grand is ~100-200 MB in memory), so only the most recently used instruments stay decoded.
  const BUDGET = 700e6;
  const engines = new Map();
  let clock = 0;

  const S = (WS.sounds = { INSTRUMENTS, BY_ID });
  S.def = (id) => BY_ID[id] || BY_ID.salamander;
  S.engine = (id) => {
    const d = S.def(id);
    if (!engines.has(d.id)) engines.set(d.id, d.synth ? new WS.PadSynth(d) : new WS.Sampler(d));
    const e = engines.get(d.id);
    e.used = ++clock;
    return e;
  };
  S.loaded = () => [...engines.values()].filter((e) => e.status !== 'idle');
  S.trim = (keep = []) => {
    const list = [...engines.values()].filter((e) => e.bytes > 0).sort((a, b) => a.used - b.used);
    let total = list.reduce((s, e) => s + e.bytes, 0);
    for (const e of list) {
      if (total <= BUDGET) break;
      if (keep.includes(e.id) || e.status === 'loading') continue;
      total -= e.bytes;
      e.unload();
    }
  };
  S.load = (id, keep) => {
    const e = S.engine(id);
    const p = e.load();
    Promise.resolve(p).then(() => S.trim(keep || [id]));
    return e;
  };

  /* The grand that lessons and drills use, whatever Play is set to. */
  WS.piano = S.engine('salamander');
  WS.piano.applySettings = () => WS.out.apply();
  WS.piano.latency = () => WS.audioLatency();

  /* ---------- The Play rig ---------- */
  const R = (WS.rig = { active: false, held: new Map() });

  /* Which instruments the current setup uses, with each one's level (layer mix) and key range. */
  R.parts = () => {
    const s = WS.S().settings;
    if (s.soundMode === 'split') {
      return [
        { id: S.def(s.splitLo).id, level: 1, lo: 0, hi: s.splitPoint - 1, side: 'left' },
        { id: S.def(s.splitHi).id, level: 1, lo: s.splitPoint, hi: 127, side: 'right' },
      ];
    }
    if (s.soundMode === 'layer') {
      const m = WS.clamp(s.layerMix, 0, 1);
      const a = S.def(s.layerA).id, b = S.def(s.layerB).id;
      if (a === b) return [{ id: a, level: 1, lo: 0, hi: 127 }];
      return [
        { id: a, level: Math.cos(m * Math.PI / 2), lo: 0, hi: 127 },
        { id: b, level: Math.sin(m * Math.PI / 2), lo: 0, hi: 127 },
      ];
    }
    return [{ id: S.def(s.sound).id, level: 1, lo: 0, hi: 127 }];
  };

  /* Load what the setup needs and quiet anything it no longer uses. */
  R.configure = () => {
    const parts = R.parts();
    const ids = parts.map((p) => p.id);
    for (const e of S.loaded()) if (!ids.includes(e.id)) e.allOff();
    for (const id of ids) S.load(id, ids);
    WS.out.ensure();
    WS.bus.emit('rig', parts);
    return parts;
  };

  R.engines = () => R.parts().map((p) => S.engine(p.id));
  R.status = () => {
    const es = R.engines();
    const total = es.reduce((s, e) => s + (e.total || 0), 0);
    const loaded = es.reduce((s, e) => s + (e.loaded || 0), 0);
    return {
      ready: es.every((e) => e.ready()),
      anyReady: es.some((e) => e.ready()),
      complete: es.every((e) => e.status === 'ready' && e.loaded >= e.total),
      error: es.some((e) => e.status === 'error'),
      loading: es.filter((e) => e.status === 'loading' || (e.ready() && e.loaded < e.total)),
      pct: total ? Math.round((loaded / total) * 100) : 100,
      engines: es,
    };
  };

  R.noteOn = (n, vel) => {
    const used = [];
    for (const p of R.parts()) {
      if (n < p.lo || n > p.hi) continue;
      const e = S.engine(p.id);
      if (e.status === 'idle') S.load(p.id);
      if (e.noteOn(n, vel, p.level)) used.push(e);
    }
    R.held.set(n, used);
    return used.length > 0;
  };
  R.noteOff = (n) => {
    const used = R.held.get(n);
    if (!used) return;
    for (const e of used) e.noteOff(n);
    R.held.delete(n);
  };
  R.pedal = (down) => {
    R.pedalDown = down;
    for (const e of S.loaded()) e.pedal(down);
  };
  R.allOff = () => { for (const e of S.loaded()) e.allOff(); R.held.clear(); };
  R.voiceCount = () => S.loaded().reduce((s, e) => s + e.voiceCount(), 0);
  R.sustainedNotes = () => [...new Set(S.loaded().flatMap((e) => e.sustainedNotes()))];
})();

/* ---- 40-input.js ---- */
/* Input: Web MIDI (with permission and hot-plug) plus a computer-keyboard fallback. Emits noteon/noteoff/pedal on WS.bus. */
(function () {
  const I = (WS.input = {
    held: new Map(),       // midi note -> { vel, t, src }
    pedal: false,
    access: null,
    status: 'idle',        // idle | unsupported | denied | no-device | connected | error
    devices: [],
    qwertyWanted: false,   // set by screens that accept notes (game, keyboard, play)
    qwertySustain: false,  // Play mode: the space bar works as a sustain pedal
    lastVel: 0,
  });

  /* ---------- MIDI ---------- */
  I.midiSupported = () => typeof navigator.requestMIDIAccess === 'function';

  I.connectMidi = async function () {
    if (!I.midiSupported()) {
      I.setStatus('unsupported');
      return false;
    }
    try {
      I.access = await navigator.requestMIDIAccess({ sysex: false });
    } catch (err) {
      const blocked = err && (err.name === 'SecurityError' || err.name === 'NotAllowedError');
      I.setStatus(blocked ? (location.protocol === 'file:' ? 'denied-file' : 'denied') : 'error');
      return false;
    }
    I.access.onstatechange = () => I.attach();
    I.attach();
    return true;
  };

  /* If permission was granted before, connect without a prompt. */
  I.autoConnect = async function () {
    if (!I.midiSupported() || !navigator.permissions) return;
    try {
      const p = await navigator.permissions.query({ name: 'midi', sysex: false });
      if (p.state === 'granted') await I.connectMidi();
    } catch (e) { /* some browsers don't expose the midi permission */ }
  };

  I.attach = function () {
    if (!I.access) return;
    I.devices = [];
    for (const input of I.access.inputs.values()) {
      if (input.state === 'disconnected') continue;
      input.onmidimessage = I.onMidi;
      I.devices.push({ id: input.id, name: input.name || 'MIDI keyboard', manufacturer: input.manufacturer || '' });
    }
    if (!I.devices.length) I.releaseAll();
    I.setStatus(I.devices.length ? 'connected' : 'no-device');
  };

  I.setStatus = function (s) {
    I.status = s;
    WS.bus.emit('inputstatus', s);
  };

  I.onMidi = function (e) {
    const [st, d1, d2] = e.data;
    const cmd = st & 0xf0;
    const t = e.timeStamp || performance.now();
    if (cmd === 0x90 && d2 > 0) I.noteOn(d1, d2, t, 'midi');
    else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) I.noteOff(d1, t, 'midi');
    else if (cmd === 0xb0 && d1 === 64) I.setPedal(d2 >= 64, t);
  };

  /* ---------- Shared note handling ---------- */
  I.noteOn = function (n, vel, t, src) {
    I.held.set(n, { vel, t, src });
    I.lastVel = vel;
    // A screen can claim the next key (Play uses this to set the split point); it isn't sounded or graded
    if (I.captureNext) { const f = I.captureNext; I.captureNext = null; f(n); I.held.delete(n); return; }
    if (I.shouldSound(src)) WS.audio.playNote(n, vel);
    WS.bus.emit('noteon', { n, vel, t, src });
  };
  I.noteOff = function (n, t, src) {
    if (!I.held.has(n)) return;
    I.held.delete(n);
    WS.audio.stopNote(n);
    WS.bus.emit('noteoff', { n, t, src });
  };
  /* Whether the app should make a sound for a note. Play mode always does; elsewhere it follows the setting. */
  I.forceSound = false;
  I.shouldSound = function (src) {
    if (I.forceSound) return true;
    const synth = WS.S().settings.synth;
    return (src === 'qwerty' && synth !== 'off') || (src !== 'qwerty' && synth === 'on');
  };
  I.setPedal = function (down, t) {
    I.pedal = down;
    WS.audio.pedal(down);
    WS.bus.emit('pedal', { down, t });
  };
  I.releaseAll = function () {
    const t = performance.now();
    for (const n of [...I.held.keys()]) I.noteOff(n, t, 'release');
  };
  I.notes = () => [...I.held.keys()].sort((a, b) => a - b);
  I.strikeTime = (n) => (I.held.get(n) || { t: 0 }).t;

  /* ---------- Computer keyboard ---------- */
  // Bottom row: C3 upward. Top row: C4 upward. Number keys are the black keys.
  const MAP = {
    KeyZ: 0, KeyS: 1, KeyX: 2, KeyD: 3, KeyC: 4, KeyV: 5, KeyG: 6, KeyB: 7, KeyH: 8, KeyN: 9, KeyJ: 10, KeyM: 11,
    Comma: 12, KeyL: 13, Period: 14, Semicolon: 15, Slash: 16,
    KeyQ: 12, Digit2: 13, KeyW: 14, Digit3: 15, KeyE: 16, KeyR: 17, Digit5: 18, KeyT: 19, Digit6: 20, KeyY: 21,
    Digit7: 22, KeyU: 23, KeyI: 24, Digit9: 25, KeyO: 26, Digit0: 27, KeyP: 28,
  };
  I.QWERTY_MAP = MAP;
  const down = new Map(); // code -> note

  I.qwertyActive = function () {
    const mode = WS.S().settings.inputMode;
    if (!I.qwertyWanted || mode === 'midi') return false;
    if (mode === 'qwerty') return true;
    return I.status !== 'connected';
  };
  I.qwertyBase = () => 48 + 12 * (WS.S().settings.octave || 0);

  const isTyping = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);

  window.addEventListener('keydown', (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || isTyping(document.activeElement)) return;
    if (!I.qwertyActive()) return;
    if (e.code === 'Minus' || e.code === 'Equal') {
      const s = WS.S().settings;
      s.octave = WS.clamp((s.octave || 0) + (e.code === 'Equal' ? 1 : -1), -2, 2);
      WS.store.save();
      WS.bus.emit('octave', s.octave);
      e.preventDefault();
      return;
    }
    if (e.code === 'Space' && I.qwertySustain) { if (!I.pedal) I.setPedal(true, e.timeStamp || performance.now()); e.preventDefault(); return; }
    if (!(e.code in MAP) || down.has(e.code)) return;
    const n = I.qwertyBase() + MAP[e.code];
    down.set(e.code, n);
    I.noteOn(n, 90, e.timeStamp || performance.now(), 'qwerty');
    e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && I.qwertySustain && I.pedal) { I.setPedal(false, e.timeStamp || performance.now()); return; }
    if (!down.has(e.code)) return;
    const n = down.get(e.code);
    down.delete(e.code);
    I.noteOff(n, e.timeStamp || performance.now(), 'qwerty');
  });
  window.addEventListener('blur', () => {
    for (const [code, n] of down) I.noteOff(n, performance.now(), 'qwerty');
    down.clear();
  });

  /* Debug/test injection (used only with ?debug) */
  I.inject = function (n, on, t, vel = 90) {
    if (on) I.noteOn(n, vel, t, 'midi'); else I.noteOff(n, t, 'midi');
  };
})();

/* ---- 50-levels.js ---- */
/* Levels, key pools, the tempo staircase, silver and gold stars, XP and item stats. */
(function () {
  const T = WS.theory;

  const LEVELS = [
    { id: 'h1-maj', lane: 'harmony', drill: 'H1', code: 'H1', name: 'Major triads', short: 'Major', kind: 'chord', qualities: ['maj'], base: 50, target: 70 },
    { id: 'h1-min', lane: 'harmony', drill: 'H1', code: 'H1', name: 'Minor triads', short: 'Minor', kind: 'chord', qualities: ['min'], base: 50, target: 70 },
    { id: 'h1-mix', lane: 'harmony', drill: 'H1', code: 'H1', name: 'Major and minor', short: 'Maj + min', kind: 'chord', qualities: ['maj', 'min'], base: 55, target: 75 },
    { id: 'h1-dimaug', lane: 'harmony', drill: 'H1', code: 'H1', name: 'Diminished and augmented', short: 'Dim + aug', kind: 'chord', qualities: ['dim', 'aug'], base: 50, target: 70 },
    { id: 'h1-all', lane: 'harmony', drill: 'H1', code: 'H1', name: 'All four triads', short: 'All triads', kind: 'chord', qualities: ['maj', 'min', 'dim', 'aug'], base: 55, target: 80 },
    { id: 'h4-maj7-dom7', lane: 'harmony', drill: 'H4', code: 'H4', name: 'Major 7 and dominant 7', short: 'maj7 + 7', kind: 'chord', qualities: ['maj7', 'dom7'], base: 45, target: 65 },
    { id: 'h4-min7-hdim', lane: 'harmony', drill: 'H4', code: 'H4', name: 'Minor 7 and half-diminished', short: 'm7 + ø7', kind: 'chord', qualities: ['min7', 'hdim7'], base: 45, target: 65 },
    { id: 'h4-dim7', lane: 'harmony', drill: 'H4', code: 'H4', name: 'Diminished 7', short: '°7', kind: 'chord', qualities: ['dim7'], base: 45, target: 65 },
    { id: 'h4-all', lane: 'harmony', drill: 'H4', code: 'H4', name: 'All five sevenths', short: 'All 7ths', kind: 'chord', qualities: ['maj7', 'dom7', 'min7', 'hdim7', 'dim7'], base: 50, target: 75 },
    { id: 'i1-a', lane: 'improv', drill: 'I1', code: 'I1', name: 'Shells, shape A', short: 'Shape A', kind: 'shell', shapes: ['A'], base: 50, target: 80, metronome: '24' },
    { id: 'i1-b', lane: 'improv', drill: 'I1', code: 'I1', name: 'Shells, shape B', short: 'Shape B', kind: 'shell', shapes: ['B'], base: 50, target: 80, metronome: '24' },
    { id: 'i1-ab', lane: 'improv', drill: 'I1', code: 'I1', name: 'Shells, both shapes', short: 'A + B', kind: 'shell', shapes: ['A', 'B'], base: 55, target: 80, metronome: '24' },
  ];
  const BY_ID = Object.fromEntries(LEVELS.map((l) => [l.id, l]));

  const LANES = [
    { id: 'harmony', name: 'Harmony', blurb: 'Chord qualities in every key', levels: LEVELS.filter((l) => l.lane === 'harmony').map((l) => l.id) },
    { id: 'improv', name: 'Improv', blurb: 'Left-hand shell voicings on ii–V–I', levels: LEVELS.filter((l) => l.lane === 'improv').map((l) => l.id) },
    { id: 'reading', name: 'Reading', blurb: 'Sight-reading', locked: true, soon: 'Note Rain, the sight-reading trainer, is the next build. Keep reading from your books for now.' },
    { id: 'ear', name: 'Ear', blurb: 'Scale degrees and bass lines', locked: true, soon: 'Echo and Bass Detective come after Note Rain. Use the E-drills in the Drill Library for now.' },
  ];

  const L = (WS.levels = { LEVELS, BY_ID, LANES });
  L.ROUND = 12;        // prompts per round
  L.PASS = 11;         // hits needed to pass
  L.POOL_STEP = 3;     // keys added after a passed round

  L.def = (id) => BY_ID[id];

  L.state = (id) => {
    const s = WS.S();
    if (!s.levels[id]) {
      const d = BY_ID[id];
      s.levels[id] = {
        pool: 3, tempo: d.base, passStreak: 0, reversals: 0, lastDir: null,
        stars: [{ s: null, g: null }, { s: null, g: null }, { s: null, g: null }],
        lastPlayed: null, coldDay: null, rounds: 0, passes: 0, best: 0,
      };
    }
    return s.levels[id];
  };

  L.starCriteria = (d) => [
    `Pass a round with all 12 keys at ♩ = ${d.base}`,
    `Pass a round at ♩ = ${d.target}`,
    `Flawless round (12 of 12) at ♩ = ${d.target}`,
  ];

  L.isUnlocked = (id) => {
    const d = BY_ID[id];
    const lane = LANES.find((x) => x.id === d.lane);
    const idx = lane.levels.indexOf(id);
    if (idx === 0) return true;
    const prev = L.state(lane.levels[idx - 1]);
    return !!prev.stars[0].s;
  };

  L.silverCount = (ls) => ls.stars.filter((x) => x.s).length;
  L.goldCount = (ls) => ls.stars.filter((x) => x.g).length;
  L.allGold = (ls) => ls.stars.every((x) => x.g);

  /* Gold is possible today if a silver star was earned on an earlier day and isn't gold yet. */
  L.goldChance = (id) => {
    const ls = L.state(id);
    const today = WS.todayKey();
    return ls.stars.some((x) => x.s && x.s < today && !x.g);
  };
  /* The first round of the day on a level is its cold check. */
  L.coldReady = (id) => L.goldChance(id) && L.state(id).lastPlayed !== WS.todayKey();
  L.coldTempo = (id) => {
    const d = BY_ID[id];
    const ls = L.state(id);
    const today = WS.todayKey();
    const needsTarget = [1, 2].some((i) => ls.stars[i].s && ls.stars[i].s < today && !ls.stars[i].g);
    return needsTarget ? d.target : d.base;
  };

  L.keysInPool = (ls) => T.KEY_ORDER.slice(0, ls.pool);

  /* ---------- Item stats (per chord and key) ---------- */
  L.item = (key) => {
    const s = WS.S();
    if (!s.items[key]) s.items[key] = { n: 0, hit: 0, recent: [], absMs: 0 };
    return s.items[key];
  };
  L.itemWeakness = (key) => {
    const it = WS.S().items[key];
    if (!it || !it.recent.length) return 0.5;
    const acc = (it.recent.reduce((a, b) => a + b, 0) + 1) / (it.recent.length + 2);
    return 1 - acc;
  };
  const recordItem = (key, hit, offsetMs) => {
    const it = L.item(key);
    it.n++;
    if (hit) it.hit++;
    it.recent.push(hit ? 1 : 0);
    if (it.recent.length > 12) it.recent.shift();
    if (hit && Number.isFinite(offsetMs)) it.absMs = it.absMs ? it.absMs * 0.8 + Math.abs(offsetMs) * 0.2 : Math.abs(offsetMs);
  };

  /* ---------- Building a round ---------- */
  const samePcs = (a, b) => a.pcs.length === b.pcs.length && a.pcs.every((p) => b.pcs.includes(p));
  const fixAdjacent = (list) => {
    for (let pass = 0; pass < 4; pass++) {
      let changed = false;
      for (let i = 1; i < list.length; i++) {
        if (!samePcs(list[i], list[i - 1])) continue;
        const j = list.findIndex((x, k) => k > i && !samePcs(x, list[i - 1]) && (k + 1 >= list.length || !samePcs(list[i], list[k + 1])));
        if (j > 0) { [list[i], list[j]] = [list[j], list[i]]; changed = true; }
      }
      if (!changed) break;
    }
    return list;
  };

  L.makePrompts = (id, poolOverride) => {
    const d = BY_ID[id];
    const ls = L.state(id);
    const keys = T.KEY_ORDER.slice(0, poolOverride || ls.pool);
    if (d.kind === 'chord') {
      let roots = [];
      while (roots.length < L.ROUND) roots.push(...WS.shuffle(keys.slice()));
      roots = roots.slice(0, L.ROUND);
      const list = roots.map((r) => {
        const q = WS.pickWeighted(d.qualities, (q) => 0.4 + L.itemWeakness(`${q}:${r}`));
        return T.chord(r, q);
      });
      return fixAdjacent(WS.shuffle(list));
    }
    // Shells: four ii–V–I progressions, keys weighted toward weak and least-recent ones
    const progs = Math.round(L.ROUND / 3);
    const chosen = [];
    const avail = keys.slice();
    for (let p = 0; p < progs; p++) {
      if (!avail.length) avail.push(...keys.filter((k) => k !== chosen[chosen.length - 1]));
      const k = WS.pickWeighted(avail, (k) => 0.4 + ['ii', 'V', 'I'].reduce((s, r) => s + L.itemWeakness(`sh${d.shapes[0]}-${r}:${k}`), 0) / 3);
      avail.splice(avail.indexOf(k), 1);
      chosen.push(k);
    }
    const list = [];
    for (const k of chosen) {
      const shape = d.shapes[Math.floor(Math.random() * d.shapes.length)];
      for (const role of ['ii', 'V', 'I']) list.push(T.shell(k, role, shape));
    }
    return list;
  };

  /* ---------- Plan a round: tempo, pool, cold/challenge flags ---------- */
  L.planRound = (id, mode = 'normal') => {
    const d = BY_ID[id];
    const ls = L.state(id);
    const cold = L.coldReady(id);
    let tempo = ls.tempo;
    let pool = ls.pool;
    let challenge = false;
    if (cold) { tempo = L.coldTempo(id); pool = 12; }
    else if (mode === 'challenge') { tempo = d.target; pool = 12; challenge = true; }
    return { id, def: d, tempo, pool, cold, challenge, prompts: L.makePrompts(id, pool) };
  };

  /* ---------- Apply a finished round ---------- */
  L.applyRound = (plan, res) => {
    const s = WS.S();
    const d = plan.def;
    const ls = L.state(plan.id);
    const today = WS.todayKey();
    const fullPool = plan.pool >= 12;
    const passed = res.hits >= L.PASS;
    const flawless = res.hits === res.n;
    const out = { passed, flawless, earned: [], notes: [], xp: 0, nextTempo: ls.tempo };

    // Item stats
    plan.prompts.forEach((p, i) => recordItem(p.item, res.results[i].hit, res.results[i].offsetMs));

    // Stars: silver any time; gold only on the cold round, for silver earned on an earlier day
    const meets = [
      passed && fullPool && plan.tempo >= d.base,
      passed && fullPool && plan.tempo >= d.target,
      flawless && fullPool && plan.tempo >= d.target,
    ];
    meets.forEach((ok, i) => {
      if (ok && !ls.stars[i].s) { ls.stars[i].s = today; out.earned.push({ i, kind: 'silver' }); }
    });
    if (plan.cold) {
      meets.forEach((ok, i) => {
        const st = ls.stars[i];
        if (ok && st.s && st.s < today && !st.g) { st.g = today; out.earned.push({ i, kind: 'gold' }); }
      });
      ls.coldDay = today;
      out.coldResult = out.earned.some((e) => e.kind === 'gold') ? 'gold' : 'missed';
    }

    // Key pool and tempo staircase (normal rounds only)
    if (!plan.cold && !plan.challenge) {
      if (ls.pool < 12) {
        if (passed) {
          const added = T.KEY_ORDER.slice(ls.pool, Math.min(12, ls.pool + L.POOL_STEP)).map((k) => T.KEY_NAME[k]);
          ls.pool = Math.min(12, ls.pool + L.POOL_STEP);
          out.notes.push(`Keys added: ${added.join(', ')}.`);
        } else {
          ls.tempo = Math.max(d.base - 15, ls.tempo - 4);
          out.notes.push(`Tempo down to ♩ = ${ls.tempo}.`);
        }
      } else if (passed) {
        ls.passStreak++;
        if (ls.passStreak >= 3) {
          const step = ls.reversals < 2 ? 8 : 4;
          if (ls.lastDir === 'down') ls.reversals++;
          ls.lastDir = 'up';
          ls.tempo = Math.min(200, ls.tempo + step);
          ls.passStreak = 0;
          out.notes.push(`Three clean rounds in a row: tempo up to ♩ = ${ls.tempo}.`);
        } else {
          out.notes.push(`${ls.passStreak} of 3 clean rounds toward a faster tempo.`);
        }
      } else {
        const step = ls.reversals < 2 ? 8 : 4;
        if (ls.lastDir === 'up') ls.reversals++;
        ls.lastDir = 'down';
        ls.passStreak = 0;
        ls.tempo = Math.max(d.base - 15, ls.tempo - step);
        out.notes.push(`Tempo down to ♩ = ${ls.tempo} so you land more of them.`);
      }
    }
    out.nextTempo = ls.tempo;

    ls.rounds++;
    if (passed) { ls.passes++; ls.best = Math.max(ls.best, plan.tempo); }

    // XP: verified progress pays most; replaying a fully gold level pays little
    let xp = res.hits * 2 + (passed ? 10 : 0);
    if (L.allGold(ls) && !out.earned.length) xp = Math.round(xp * 0.25);
    for (const e of out.earned) xp += e.kind === 'gold' ? 100 : 50;
    out.xp = xp;
    s.xp += xp;

    // Day record
    const day = WS.progress.day(today);
    day.rounds++;
    day.focus = true;
    day.minutes = Math.round((day.minutes + res.durationSec / 60) * 10) / 10;
    day.xp += xp;

    s.rounds.push({
      at: new Date(WS.nowMs()).toISOString(), day: today, level: plan.id, tempo: plan.tempo, pool: plan.pool,
      hits: res.hits, n: res.n, perfects: res.perfects, passed, cold: plan.cold, challenge: plan.challenge,
      xp, meanOffsetMs: res.meanOffsetMs, misses: res.misses.slice(0, 12),
    });
    if (s.rounds.length > 600) s.rounds.splice(0, s.rounds.length - 600);
    WS.store.save();
    return out;
  };

  /* Next level to play in a lane: first unlocked level missing ★1, then ★2, then ★3. */
  L.nextInLane = (laneId) => {
    const lane = LANES.find((x) => x.id === laneId);
    if (!lane || lane.locked) return null;
    for (let star = 0; star < 3; star++) {
      for (const id of lane.levels) {
        if (!L.isUnlocked(id)) break;
        if (!L.state(id).stars[star].s) return id;
      }
    }
    return lane.levels[lane.levels.length - 1];
  };
})();

/* ---- 55-progress.js ---- */
/* Daily core, weekly goal, streak with freezes, ranks, and tonight's plan from the Piano Roadmap. */
(function () {
  const P = (WS.progress = {});
  P.WEEK_GOAL = 5;
  P.MAX_FREEZES = 2;
  P.RANKS = [
    { name: 'Busker', xp: 0 },

  };

  P.setTask = (k, field, val) => {

    const d = P.day(k);
    const was = d.core;
    d[field] = val;
    d.core = d.sight && d.score;
    if (d.core && !was) {
      s.xp += 30; d.xp += 30;
      s.freezeProgress++;
      if (s.freezeProgress >= 7) {
        s.freezeProgress = 0;
        if (s.freezes < P.MAX_FREEZES) { s.freezes++; WS.toast('Seven core days: you earned a streak freeze.'); }
      }
      P.checkWeek(k);
    } else if (!d.core && was) {
      s.xp = Math.max(0, s.xp - 30); d.xp = Math.max(0, d.xp - 30);

    const mon = WS.mondayOf(k);

  };

  P.checkWeek = (k) => {
    const s = WS.S();

  // Phase 1 week-by-week table from the Drill Library.
  P.PHASE1 = [
    null,
    { score: 'Gymnopédie No. 1: set up the score, then bars 1–8', ear: 'E1 in C', harmony: 'H1 major and minor: C, F, B♭, E♭, A♭, D♭', improv: 'I1 shape A, left hand only: C, F, B♭' },
    { score: 'Gymnopédie: bars 9–16', ear: 'E1 in G, then F', harmony: 'H1 all four qualities, all 12 keys', improv: 'I1 shape A: E♭, A♭, D♭, G♭; right-hand chord tones in C' },
    { score: 'Gymnopédie: bars 17–24', ear: 'E2: Twinkle Twinkle, Ode to Joy', harmony: 'H2 major ladders, all 12 keys', improv: 'I1 shape B: C, F, B♭, E♭; right-hand chord tones in F' },
    { score: 'Gymnopédie: bars 25–32', ear: 'E2: Amazing Grace, Happy Birthday', harmony: 'H2 minor ladders; H3 in all 12 keys', improv: 'I1 both shapes, all 12 keys (pass test)' },
    { score: 'Gymnopédie: the rest (mark the bars that differ)', ear: 'E3: Twist and Shout', harmony: 'H4: C, F, B♭, E♭, A♭, D♭', improv: 'I2 in C, with I3 as a warmup' },
    { score: 'Gymnopédie: whole piece with pedal and dynamics; record it', ear: 'E3: Stand By Me', harmony: 'Tue H4: G♭, B, E, A, D, G · Fri H6', improv: 'I2 in F and B♭' },
    { score: 'Chopin Prelude in E minor: set up the score, then bars 1–6', ear: 'E3: With or Without You', harmony: 'Tue H5 · Fri H6', improv: 'I2 in E♭ and G' },
    { score: 'Chopin: bars 7–12', ear: 'E3: Perfect, then check all four answers', harmony: 'Tue H7: C, F, B♭, E♭, A♭, D♭ · Fri H6', improv: 'I4 in C and F' },
    { score: 'Chopin: bars 13–18', ear: 'E4 + a song you choose, melody and bass', harmony: 'Tue H7: G♭, B, E, A, D, G · Fri H8', improv: 'I4 in B♭, E♭, G' },
    { score: 'Chopin: bars 19–25', ear: 'E4 + a second song', harmony: 'H9, all 12 keys', improv: 'I5 in C and F' },
    { score: 'Chopin: whole piece, hands together', ear: 'E4 + a third song', harmony: 'H10, all 12 keys', improv: 'I5 in B♭ and G' },
    { score: 'Chopin: dynamics and pedal; record it', ear: 'Milestone check: 3 songs, melody and bass', harmony: 'H11, all 12 keys', improv: 'Phase 1 test (on the I5 card)' },
  ];
  // Which app levels serve each week's drill. Empty = not in the app yet.
  const APP_MAP = {
    harmony: { 1: ['h1-maj', 'h1-min', 'h1-mix'], 2: ['h1-dimaug', 'h1-all'], 5: ['h4-maj7-dom7', 'h4-min7-hdim'], 6: ['h4-dim7', 'h4-all'], 7: ['h4-all'] },
    improv: { 1: ['i1-a'], 2: ['i1-a'], 3: ['i1-b'], 4: ['i1-ab'] },
  };

  P.weekNumber = (k = WS.todayKey()) => {
    const s = WS.S().settings;
    return Math.max(1, Math.floor(WS.daysBetween(s.planStart, k) / 7) + 1);
  };

  P.tonight = (k = WS.todayKey()) => {
    const week = P.weekNumber(k);
    const dow = WS.dowIndex(k);

    const row = P.PHASE1[week] || null;
    const plan = { week, dow, focus, row, phase: week <= 12 ? 1 : 2 };
    if (focus === 'harmony' || focus === 'improv') {
      plan.drill = row ? row[focus] : null;
      const ids = (APP_MAP[focus][week] || []).filter((id) => WS.levels.isUnlocked(id));

      let pick = ids.find((id) => WS.levels.state(id).stars[0].s == null) || ids.find((id) => WS.levels.state(id).stars[1].s == null);

    } else if (focus === 'ear') {
      plan.drill = row ? row.ear : null;
      plan.inApp = false;
    } else {
      plan.drill = 'Record your score piece and one improv clip, then look over the week.';
      plan.inApp = false;
    }
    return plan;
  };
})();

/* ---- 60-runner.js ---- */
/* Chord Runner: the game engine. A chord name rides in on each crate; play it on beat 1 to jump. */
(function () {
  const A = WS.audio;
  const T = WS.theory;

  const COLORS = {
    skyTop: '#121C17', skyBottom: '#344E41', hillFar: '#2A4034', hillNear: '#22362B', pine: '#1A2A21',
    plankTop: '#9B7A52', plank: '#5E4A33', plankDark: '#3F3223', ground: '#121C17',
    crate: '#9A7A4E', crateDark: '#5B4630', label: '#DAD7CD', ink: '#1E2C25',
    paper: '#DAD7CD', moon: '#A3B18A', hit: '#8FC27F', miss: '#E8806E', gold: '#E9C46A',
  };

  /* Draw a chord symbol lead-sheet style: big root, smaller accidental and quality. */
  WS.drawSym = function (ctx, sym, x, y, size, color, align = 'center') {
    const p = T.symParts(sym);
    const fRoot = `700 ${size}px Kalam, "Marker Felt", cursive`;
    const fAcc = `${Math.round(size * 0.62)}px "Apple Symbols", "Segoe UI Symbol", "Noto Music", sans-serif`;
    const fSuf = `700 ${Math.round(size * 0.62)}px Kalam, "Marker Felt", cursive`;
    ctx.save();
    ctx.textBaseline = 'alphabetic';
    ctx.font = fRoot; const wR = ctx.measureText(p.letter).width;
    ctx.font = fAcc; const wA = p.acc ? ctx.measureText(p.acc).width + size * 0.02 : 0;
    ctx.font = fSuf; const wS = p.suffix ? ctx.measureText(p.suffix).width : 0;
    const total = wR + wA + wS;
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    ctx.fillStyle = color;
    ctx.font = fRoot; ctx.fillText(p.letter, cx, y); cx += wR;
    if (p.acc) { ctx.font = fAcc; ctx.fillText(p.acc, cx + size * 0.01, y - size * 0.3); cx += wA; }
    if (p.suffix) { ctx.font = fSuf; ctx.fillText(p.suffix, cx, y - size * 0.08); }
    ctx.restore();
    return total;
  };
  WS.measureSym = function (ctx, sym, size) {
    const p = T.symParts(sym);
    ctx.save();
    ctx.font = `700 ${size}px Kalam, cursive`; let w = ctx.measureText(p.letter).width;
    ctx.font = `${Math.round(size * 0.62)}px "Apple Symbols", "Segoe UI Symbol", sans-serif`; if (p.acc) w += ctx.measureText(p.acc).width + size * 0.02;
    ctx.font = `700 ${Math.round(size * 0.62)}px Kalam, cursive`; if (p.suffix) w += ctx.measureText(p.suffix).width;
    ctx.restore();
    return w;
  };

  class ChordRunner {
    constructor(opts) {
      Object.assign(this, opts); // plan, hud, onDone, onQuit
      this.canvas = WS.$('#game-canvas');
      this.g = this.canvas.getContext('2d');
      this.prompts = this.plan.prompts;
      this.tempo = this.plan.tempo;
      this.spb = 60 / this.tempo;
      this.bpb = 4;
      this.countIn = 1;
      // Grading windows (seconds): early up to half a beat, late up to a quarter beat, "perfect" within 8% of a beat (min 60 ms)
      this.E = WS.clamp(0.5 * this.spb, 0.25, 0.7);
      this.L = WS.clamp(0.25 * this.spb, 0.15, 0.35);
      this.P = Math.max(0.06, 0.08 * this.spb);
      this.cal = (WS.S().settings.calibrationMs || 0) / 1000;
      const n = this.prompts.length;
      this.results = new Array(n).fill(null);
      this.matches = new Array(n).fill(null);
      this.early = new Array(n).fill(false);
      this.snap = new Array(n).fill(null);
      this.broken = new Array(n).fill(false);
      this.jumps = [];
      this.parts = [];
      this.pops = [];
      this.stumbleAt = -1;
      this.combo = 0;
      this.running = false;
      this.reduced = WS.reducedMotion();
      this.buildScenery();
    }

    buildScenery() {
      const r = WS.rng(7);
      this.starsBg = Array.from({ length: 140 }, () => ({ x: r(), y: r() * 0.62, s: 0.4 + r() * 1.3, p: r() * Math.PI * 2 }));
      this.pines = Array.from({ length: 36 }, (_, i) => ({ x: i * 46 + r() * 20, h: 40 + r() * 70, w: 18 + r() * 16 }));
    }

    resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = this.canvas.clientWidth || window.innerWidth;
      const h = this.canvas.clientHeight || window.innerHeight;
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
      this.g.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.W = w; this.H = h;
      this.groundY = Math.round(h * 0.7);
      this.charX = Math.round(w * 0.24);
      this.pxPerBeat = WS.clamp(w * 0.09, 64, 140);
      this.pxPerSec = this.pxPerBeat / this.spb;
      this.cs = WS.clamp(h * 0.09, 48, 78);
      this.u = WS.clamp(h / 820, 0.75, 1.35);
      this.skyGrad = this.g.createLinearGradient(0, 0, 0, this.groundY);
      this.skyGrad.addColorStop(0, COLORS.skyTop);
      this.skyGrad.addColorStop(1, COLORS.skyBottom);
    }

    start() {
      const c = A.ensure();
      this.t0 = c.currentTime + 0.6;
      this.downbeats = this.prompts.map((_, i) => this.t0 + (this.countIn + i) * this.bpb * this.spb);
      this.lastT = this.downbeats[this.downbeats.length - 1];
      this.endT = this.lastT + this.L + 0.7;
      this.metro = new A.Metronome();
      this.metro.start({ t0: this.t0, spb: this.spb, beatsPerBar: this.bpb, pattern: this.plan.def.metronome || 'all', countInBars: this.countIn, endTime: this.lastT + this.spb * 0.5 });
      this.unsub = [WS.bus.on('noteon', (e) => this.onInput(e)), WS.bus.on('noteoff', (e) => this.onInput(e))];
      this._resize = () => this.resize();
      window.addEventListener('resize', this._resize);
      this.resize();

      this.lastFrame = performance.now();
      this.startPerf = performance.now();
      this.hud.setPrompt(0, this);
      this.frame = this.frame.bind(this);
      requestAnimationFrame(this.frame);
    }

    stopAll() {
      this.running = false;
      if (this.metro) this.metro.stop();
      (this.unsub || []).forEach((f) => f());

    }

    quit() {

        const d = this.downbeats[i];
        if (t >= d - this.E && t <= d + this.L) return i;
        if (t < d - this.E) return -1;
      }
      return -1;
    }

    currentIndex() {
      for (let i = 0; i < this.prompts.length; i++) if (!this.results[i] && !this.matches[i]) return i;
      return this.prompts.length;
    }

    onInput(e) {
      if (!this.running) return;
      const notes = WS.input.notes();
      const t = A.perfToHeard(e.t) - this.cal;
      const i = this.windowIndex(t);
      if (i < 0) {
        const k = this.currentIndex();
        if (k < this.prompts.length && t < this.downbeats[k] - this.E && T.matches(this.prompts[k], notes)) this.early[k] = true;
        return;
      }
      if (this.results[i]) return;
      if (notes.length) this.snap[i] = notes.slice();
      if (this.matches[i] || !T.matches(this.prompts[i], notes)) return;
      const lastStrike = Math.max(...notes.map((n) => WS.input.strikeTime(n)));
      const onset = A.perfToHeard(lastStrike) - this.cal;
      if (onset < this.downbeats[i] - this.E) { this.early[i] = true; return; }
      this.matches[i] = { t: onset };
      this.onMatch(i, onset);
    }

    onMatch(i, onset) {
      const d = this.downbeats[i];
      const off = onset - d;
      const perfect = Math.abs(off) <= this.P;
      const dur = WS.clamp(0.9 * this.spb, 0.38, 0.7);
      let start = d - dur / 2;
      let len = dur;
      const now = A.heardNow();
      if (start < now) { start = now; len = Math.max(0.3, (d + dur / 2) - now); }
      this.jumps.push({ start, dur: len, i });
      this.combo++;
      this.pop(perfect ? 'Perfect' : off < 0 ? 'Good · early' : 'Good · late', perfect ? COLORS.paper : COLORS.hit, i);
      A.sfx(perfect ? 'perfect' : 'good');

      this.hud.setCombo(this.combo);

    judge(i) {
      const m = this.matches[i];
      const d = this.downbeats[i];
      if (m) {
        const off = (m.t - d) * 1000;
        this.results[i] = { hit: true, perfect: Math.abs(off) <= this.P * 1000, offsetMs: Math.round(off) };
      } else {

    reason(i) {

      }
    }

        const sp = 40 + Math.random() * 120;
        this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.6, age: 0, size: 2 + Math.random() * 2.5, color, star: true });

    worldX(t, now) { return this.charX + (t - now) * this.pxPerSec; }

    draw(now, dt) {
